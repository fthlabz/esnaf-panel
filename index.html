<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Control - Kurumsal Yönetim Sistemi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#050508',
                            card: '#101016',
                            border: '#1f1f2b',
                            hover: '#181822'
                        },
                        brand: {
                            blue: '#3b82f6',
                            green: '#10b981',
                            orange: '#f59e0b',
                            red: '#ef4444'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #050508; }
        ::-webkit-scrollbar-thumb { background: #1f1f2b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #374151; }
        .glass { background: rgba(16, 16, 22, 0.85); backdrop-filter: blur(12px); }
    </style>
</head>
<body class="bg-dark-bg text-gray-100 min-h-screen flex flex-col md:flex-row antialiased selection:bg-brand-blue selection:text-white">

    <!-- Toast Bildirim Alanı -->
    <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Mobil Üst Menü -->
    <header class="md:hidden glass sticky top-0 z-40 border-b border-dark-border px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-brand-blue flex items-center justify-center font-bold text-sm shadow-lg shadow-blue-500/30">EX</div>
            <span class="font-bold text-sm tracking-wide">EXECUTIVE CONTROL</span>
        </div>
        <button onclick="toggleMobileMenu()" class="p-2 rounded-lg bg-dark-border text-gray-300 hover:text-white">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"/></svg>
        </button>
    </header>

    <!-- Mobil Açılır Navigasyon Overlay -->
    <div id="mobileMenu" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden md:hidden flex flex-col">
        <div class="flex justify-between items-center p-4 border-b border-dark-border">
            <span class="font-bold text-sm">MENÜLER</span>
            <button onclick="toggleMobileMenu()" class="p-2 text-gray-400 hover:text-white">✕</button>
        </div>
        <div id="mobileNavContent" class="overflow-y-auto p-4 flex-1 space-y-4"></div>
    </div>

    <!-- Masaüstü Sol Sabit Navigasyon -->
    <aside class="hidden md:flex flex-col w-72 bg-dark-card border-r border-dark-border h-screen sticky top-0 shrink-0">
        <div class="p-5 border-b border-dark-border flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-blue to-indigo-600 flex items-center justify-center font-bold shadow-lg shadow-blue-500/20">EX</div>
            <div>
                <h1 class="text-xs font-bold tracking-wider text-white">EXECUTIVE CONTROL</h1>
                <p class="text-[10px] text-gray-400">Çok Şubeli Yönetim Sistemi</p>
            </div>
        </div>
        <div id="desktopNavContent" class="flex-1 overflow-y-auto p-4 space-y-6"></div>
        <div class="p-4 border-t border-dark-border text-xs text-gray-400 flex justify-between items-center">
            <span>Güvenli Çöp Kutusu Aktif</span>
            <button onclick="resetDemoData()" class="text-brand-red hover:underline text-[11px]">Sıfırla</button>
        </div>
    </aside>

    <!-- Ana İçerik Alanı -->
    <main class="flex-1 flex flex-col min-w-0 overflow-y-auto h-screen">
        <header class="hidden md:flex glass sticky top-0 z-30 border-b border-dark-border px-8 py-4 justify-between items-center">
            <div>
                <h2 id="pageTitle" class="text-lg font-bold text-white tracking-tight">Genel Bakış</h2>
                <p id="pageSubtitle" class="text-xs text-gray-400">İşletmenizin anlık finansal ve operasyonel konsolide durumu</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="text-right">
                    <p class="text-xs font-medium text-gray-300" id="headerDate"></p>
                    <p class="text-[10px] text-brand-green font-semibold">● Güvenli Depolama Aktif</p>
                </div>
            </div>
        </header>

        <div class="p-4 md:p-8 flex-1 space-y-6" id="appMainContent"></div>
    </main>

    <!-- Modal Konteyneri -->
    <div id="globalModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 overflow-y-auto">
        <div id="modalBox" class="bg-dark-card border border-dark-border rounded-2xl w-full max-w-2xl overflow-hidden shadow-2xl my-8"></div>
    </div>

    <!-- Uygulama Script Mantığı -->
    <script>
        const STORAGE_KEY = 'executive_control_secure_data_v2';
        const TRASH_KEY = 'executive_control_trash_v2';

        const defaultData = {
            subeler: [
                { id: 'sube_1', ad: 'Merkez Şube (Mobilya)', il: 'Sakarya', ciro: 1450000, kar: 320000, gider: 150000, hedef: 1500000 },
                { id: 'sube_2', ad: 'Serdivan Beyaz Eşya', il: 'Sakarya', ciro: 980000, kar: 180000, gider: 120000, hedef: 1000000 },
                { id: 'sube_3', ad: 'Adapazarı Züccaciye', il: 'Sakarya', ciro: 650000, kar: 110000, gider: 80000, hedef: 700000 },
                { id: 'sube_4', ad: 'İzmit Kurumsal Mağaza', il: 'Kocaeli', ciro: 1850000, kar: 410000, gider: 210000, hedef: 1800000 },
                { id: 'sube_5', ad: 'Düzce Showroom', il: 'Düzce', ciro: 520000, kar: 85000, gider: 65000, hedef: 600000 }
            ],
            urunler: [
                { id: 'ur_1', kod: 'MOB-01', ad: 'Lüksemburg Koltuk Takımı', kategori: 'Mobilya', subeId: 'sube_1', alisFiyati: 18000, satisFiyati: 28500, stok: 14, kritikSinir: 3 },
                { id: 'ur_2', kod: 'BYZ-02', ad: 'Bosch No-Frost Buzdolabı', kategori: 'Beyaz Eşya', subeId: 'sube_2', alisFiyati: 12000, satisFiyati: 17400, stok: 2, kritikSinir: 4 },
                { id: 'ur_3', kod: 'ZÜC-03', ad: 'Emsan 60 Parça Yemek Takımı', kategori: 'Züccaciye', subeId: 'sube_3', alisFiyati: 3500, satisFiyati: 5900, stok: 25, kritikSinir: 5 },
                { id: 'ur_4', kod: 'MOB-04', ad: 'Roma Yemek Masası Seti', kategori: 'Mobilya', subeId: 'sube_1', alisFiyati: 9500, satisFiyati: 14900, stok: 8, kritikSinir: 2 },
                { id: 'ur_5', kod: 'MOB-05', ad: 'Modern TV Ünitesi', kategori: 'Mobilya', subeId: 'sube_1', alisFiyati: 4200, satisFiyati: 7800, stok: 1, kritikSinir: 3 }
            ],
            musteriler: [
                { id: 'mus_1', ad: 'Ahmet Yılmaz İnşaat', tip: 'Kurumsal', tel: '0532 555 1122', bakiye: 45000, risk: 'Normal' },
                { id: 'mus_2', ad: 'Mehmet Demir', tip: 'Bireysel', tel: '0535 444 3322', bakiye: 18500, risk: 'Yüksek' }
            ],
            tedarikciler: [
                { id: 'ted_1', ad: 'Çilek Mobilya Fabrika', kategori: 'Mobilya', bakiye: 120000 },
                { id: 'ted_2', ad: 'Bosch Ev Aletleri A.Ş.', kategori: 'Beyaz Eşya', bakiye: 85000 }
            ],
            finans: [
                { id: 'fin_1', tip: 'Satış', subeId: 'sube_1', aciklama: 'Koltuk Takımı Peşin Satış', tutar: 28500, tarih: '2026-11-03', kategori: 'Ciro' },
                { id: 'fin_2', tip: 'Gider', subeId: 'sube_1', aciklama: 'Kasım Ayı Elektrik Faturası', tutar: 4200, tarih: '2026-11-02', kategori: 'Genel Gider' }
            ],
            borcAlacak: [
                { id: 'ba_1', tur: 'Alacak', cari: 'Ahmet Yılmaz İnşaat', tutar: 45000, vade: '2026-11-10', durum: 'Bekliyor' },
                { id: 'ba_2', tur: 'Borç', cari: 'Çilek Mobilya Fabrika', tutar: 120000, vade: '2026-11-08', durum: 'Ödenecek' }
            ],
            personel: [
                { id: 'per_1', ad: 'Selim Aksoy', subeId: 'sube_1', gorev: 'Mağaza Müdürü', maas: 38000, performans: '%94' }
            ],
            operasyon: [
                { id: 'op_1', baslik: 'Depo Yıllık Sayımı', subeId: 'sube_1', durum: 'Devam Ediyor', sorumlusu: 'Murat Koç', tarih: '2026-11-05' }
            ]
        };

        function getDB() {
            const data = localStorage.getItem(STORAGE_KEY);
            if (!data) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultData));
                return defaultData;
            }
            return JSON.parse(data);
        }

        function saveDB(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function getTrash() {
            const trash = localStorage.getItem(TRASH_KEY);
            return trash ? JSON.parse(trash) : [];
        }

        function saveTrash(trash) {
            localStorage.setItem(TRASH_KEY, JSON.stringify(trash));
        }

        // Güvenli Silme Fonksiyonu (Çöp Kutusuna Taşıma)
        function guvenliSil(kategori, id, isim) {
            openConfirmModal(
                `"${isim}" adlı kaydı silmek istediğinize emin misiniz?`,
                "Kayıt öncelikle Çöp Kutusu'na taşınacak ve dilediğiniz zaman geri yükleyebileceksiniz.",
                () => {
                    const db = getDB();
                    const trash = getTrash();
                    let kayit = null;

                    if(kategori === 'urunler') {
                        kayit = db.urunler.find(x => x.id === id);
                        db.urunler = db.urunler.filter(x => x.id !== id);
                    } else if(kategori === 'subeler') {
                        kayit = db.subeler.find(x => x.id === id);
                        db.subeler = db.subeler.filter(x => x.id !== id);
                    } else if(kategori === 'musteriler') {
                        kayit = db.musteriler.find(x => x.id === id);
                        db.musteriler = db.musteriler.filter(x => x.id !== id);
                    } else if(kategori === 'finans') {
                        kayit = db.finans.find(x => x.id === id);
                        db.finans = db.finans.filter(x => x.id !== id);
                    }

                    if(kayit) {
                        trash.push({ kategori, kayit, silinmeTarihi: new Date().toLocaleString() });
                        saveDB(db);
                        saveTrash(trash);
                        showToast('Kayıt çöp kutusuna taşındı.', 'success');
                        renderPage(currentRoute);
                    }
                }
            );
        }

        function openConfirmModal(title, desc, onConfirm) {
            const m = document.getElementById('globalModal');
            const box = document.getElementById('modalBox');
            box.innerHTML = `
                <div class="p-6 border-b border-dark-border flex justify-between items-center">
                    <h3 class="font-bold text-sm text-brand-orange">⚠️ Güvenli Silme Onayı</h3>
                    <button onclick="modalKapat()" class="text-gray-400 hover:text-white">✕</button>
                </div>
                <div class="p-6 space-y-4">
                    <p class="text-sm font-semibold text-white">${title}</p>
                    <p class="text-xs text-gray-400">${desc}</p>
                    <div class="flex justify-end gap-3 pt-4 border-t border-dark-border">
                        <button type="button" onclick="modalKapat()" class="px-4 py-2 rounded-xl bg-dark-border text-xs text-gray-300">Vazgeç</button>
                        <button type="button" id="confirmYesBtn" class="px-4 py-2 rounded-xl bg-brand-red text-xs text-white font-semibold">Çöp Kutusuna Taşı</button>
                    </div>
                </div>
            `;
            document.getElementById('confirmYesBtn').onclick = () => {
                modalKapat();
                onConfirm();
            };
            m.classList.remove('hidden');
        }

        function resetDemoData() {
            openConfirmModal("Tüm veriler sıfırlansın mı?", "Fabrika ayarlarına dönülecektir.", () => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultData));
                localStorage.removeItem(TRASH_KEY);
                showToast('Veriler sıfırlandı.', 'success');
                renderPage(currentRoute);
            });
        }

        // --- MENÜ YAPISI ---
        const menuStructure = [
            {
                baslik: 'A. GENEL YÖNETİM',
                items: [
                    { id: 'genel-bakis', ad: '1. Genel Bakış' },
                    { id: 'sube-yonetimi', ad: '2. Şube Yönetimi' },
                    { id: 'cop-kutusu', ad: '3. Çöp Kutusu & Arşiv' }
                ]
            },
            {
                baslik: 'B. FİNANS YÖNETİMİ',
                items: [
                    { id: 'satislar', ad: '4. Satışlar' },
                    { id: 'giderler', ad: '5. Giderler' },
                    { id: 'karlilik-analizi', ad: '6. Kârlılık Analizi' },
                    { id: 'nakit-akis', ad: '7. Nakit Akış' },
                    { id: 'finansal-raporlar', ad: '8. Finansal Raporlar' }
                ]
            },
            {
                baslik: 'C. STOK VE DEPO',
                items: [
                    { id: 'genel-stok', ad: '9. Genel Stok Durumu' },
                    { id: 'kritik-stok', ad: '10. Kritik Stok Uyarıları' }
                ]
            },
            {
                baslik: 'D. VERİ AKTARIMI (CSV/EXCEL)',
                items: [
                    { id: 'csv-ice-aktar', ad: '11. CSV / Excel İçe Aktar' },
                    { id: 'json-yedek', ad: '12. JSON Yedekleme' }
                ]
            }
        ];

        let currentRoute = 'genel-bakis';

        function initNavigation() {
            const desktopNav = document.getElementById('desktopNavContent');
            const mobileNav = document.getElementById('mobileNavContent');
            
            let html = '';
            menuStructure.forEach(group => {
                html += `<div class="space-y-1">
                    <p class="text-[11px] font-bold text-gray-400 uppercase tracking-wider px-2">${group.baslik}</p>
                    <div class="space-y-0.5 mt-1">`;
                group.items.forEach(item => {
                    html += `<button onclick="navigateTo('${item.id}')" id="nav_${item.id}" class="w-full text-left px-3 py-2 rounded-lg text-xs font-medium text-gray-300 hover:bg-dark-border hover:text-white transition-all flex items-center justify-between">
                        <span>${item.ad}</span>
                    </button>`;
                });
                html += `</div></div>`;
            });

            desktopNav.innerHTML = html;
            mobileNav.innerHTML = html;
            document.getElementById('headerDate').innerText = new Date().toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        function navigateTo(routeId) {
            currentRoute = routeId;
            document.querySelectorAll('aside button, #mobileNavContent button').forEach(b => b.classList.remove('bg-brand-blue', 'text-white', 'shadow-md'));
            const activeBtnD = document.getElementById(`desktopNavContent`)?.querySelector(`#nav_${routeId}`);
            if(activeBtnD) activeBtnD.classList.add('bg-brand-blue', 'text-white', 'shadow-md');
            
            const activeBtnM = document.getElementById(`mobileNavContent`)?.querySelector(`#nav_${routeId}`);
            if(activeBtnM) activeBtnM.classList.add('bg-brand-blue', 'text-white');

            document.getElementById('mobileMenu').classList.add('hidden');
            renderPage(routeId);
        }

        function toggleMobileMenu() {
            document.getElementById('mobileMenu').classList.toggle('hidden');
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const bg = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-red-600' : 'bg-blue-600';
            toast.className = `${bg} text-white px-4 py-3 rounded-xl text-xs font-medium shadow-xl pointer-events-auto transition-all transform translate-y-2 opacity-0 flex items-center justify-between gap-3`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function renderPage(route) {
            const db = getDB();
            const main = document.getElementById('appMainContent');
            const titleEl = document.getElementById('pageTitle');
            
            let pageName = '';
            menuStructure.forEach(g => {
                g.items.forEach(i => { if(i.id === route) pageName = i.ad; });
            });
            titleEl.innerText = pageName;

            switch(route) {
                case 'genel-bakis': renderGenelBakis(db, main); break;
                case 'sube-yonetimi': renderSubeYonetimi(db, main); break;
                case 'cop-kutusu': renderCopKutusu(main); break;
                case 'satislar': renderFinansTablosu(db, main, 'Satış', 'Satışlar'); break;
                case 'giderler': renderFinansTablosu(db, main, 'Gider', 'Giderler'); break;
                case 'karlilik-analizi': renderKarlilikAnalizi(db, main); break;
                case 'nakit-akis': renderNakitAkis(db, main); break;
                case 'finansal-raporlar': renderGenelBakis(db, main); break;
                case 'genel-stok': renderGenelStokTablosu(db, main); break;
                case 'kritik-stok': renderKritikStok(db, main); break;
                case 'csv-ice-aktar': renderCsvIceAktarim(main); break;
                case 'json-yedek': renderJsonYedekleme(db, main); break;
                default: renderGenelBakis(db, main);
            }
        }

        // --- GENEL BAKIŞ ---
        function renderGenelBakis(db, main) {
            const toplamCiro = db.subeler.reduce((a, b) => a + b.ciro, 0);
            const toplamKar = db.subeler.reduce((a, b) => a + b.kar, 0);
            const kritikStokSayisi = db.urunler.filter(u => u.stok <= u.kritikSinir).length;

            main.innerHTML = `
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div class="bg-dark-card border border-dark-border p-5 rounded-2xl">
                        <p class="text-xs text-gray-400 uppercase font-medium">Toplam Ciro</p>
                        <h3 class="text-2xl font-bold text-white mt-1">${formatTL(toplamCiro)}</h3>
                    </div>
                    <div class="bg-dark-card border border-dark-border p-5 rounded-2xl">
                        <p class="text-xs text-gray-400 uppercase font-medium">Net Kâr</p>
                        <h3 class="text-2xl font-bold text-brand-green mt-1">${formatTL(toplamKar)}</h3>
                    </div>
                    <div class="bg-dark-card border border-dark-border p-5 rounded-2xl">
                        <p class="text-xs text-gray-400 uppercase font-medium">Kritik Stok</p>
                        <h3 class="text-2xl font-bold text-brand-orange mt-1">${kritikStokSayisi} Ürün</h3>
                    </div>
                </div>
            `;
        }

        // --- ŞUBE YÖNETİMİ ---
        function renderSubeYonetimi(db, main) {
            main.innerHTML = `
                <div class="bg-dark-card border border-dark-border rounded-2xl overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-dark-border text-gray-400 text-[11px] uppercase bg-dark-bg/50">
                                <th class="p-4">Şube Adı</th>
                                <th class="p-4">İl</th>
                                <th class="p-4">Ciro</th>
                                <th class="p-4 text-right">İşlem</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-dark-border text-xs">
                            ${db.subeler.map(s => `
                                <tr class="hover:bg-dark-border/30">
                                    <td class="p-4 font-semibold text-white">${s.ad}</td>
                                    <td class="p-4 text-gray-400">${s.il}</td>
                                    <td class="p-4 font-bold text-brand-blue">${formatTL(s.ciro)}</td>
                                    <td class="p-4 text-right">
                                        <button onclick="guvenliSil('subeler', '${s.id}', '${s.ad}')" class="text-brand-red hover:underline">Sil</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>`;
        }

        // --- ÇÖP KUTUSU & GERİ YÜKLEME ---
        function renderCopKutusu(main) {
            const trash = getTrash();
            main.innerHTML = `
                <div class="space-y-4">
                    <h3 class="text-sm font-bold text-white">Çöp Kutusu & Geri Yükleme</h3>
                    <div class="bg-dark-card border border-dark-border rounded-2xl overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-dark-border text-gray-400 text-[11px] uppercase bg-dark-bg/50">
                                    <th class="p-4">Kategori</th>
                                    <th class="p-4">Kayıt Adı / Bilgisi</th>
                                    <th class="p-4">Silinme Tarihi</th>
                                    <th class="p-4 text-right">İşlem</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-dark-border text-xs">
                                ${trash.length === 0 ? `<tr><td colspan="4" class="p-6 text-center text-gray-400">Çöp kutusu boş.</td></tr>` : 
                                trash.map((t, idx) => `
                                    <tr class="hover:bg-dark-border/30">
                                        <td class="p-4 font-semibold text-gray-300 uppercase">${t.kategori}</td>
                                        <td class="p-4 text-white">${t.kayit.ad || t.kayit.aciklama || t.kayit.kod || 'Kayıt'}</td>
                                        <td class="p-4 text-gray-400">${t.silinmeTarihi}</td>
                                        <td class="p-4 text-right space-x-3">
                                            <button onclick="geriYukle(${idx})" class="text-brand-green hover:underline font-semibold">Geri Yükle</button>
                                            <button onclick="kaliciSil(${idx})" class="text-brand-red hover:underline">Kalıcı Sil</button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>`;
        }

        function geriYukle(idx) {
            const trash = getTrash();
            const db = getDB();
            const item = trash[idx];

            if(item.kategori === 'urunler') db.urunler.push(item.kayit);
            else if(item.kategori === 'subeler') db.subeler.push(item.kayit);
            else if(item.kategori === 'musteriler') db.musteriler.push(item.kayit);
            else if(item.kategori === 'finans') db.finans.push(item.kayit);

            trash.splice(idx, 1);
            saveDB(db);
            saveTrash(trash);
            showToast('Kayıt başarıyla geri yüklendi.', 'success');
            renderPage(currentRoute);
        }

        function kaliciSil(idx) {
            openConfirmModal("Kalıcı olarak silinsin mi?", "Bu işlem geri alınamaz!", () => {
                const trash = getTrash();
                trash.splice(idx, 1);
                saveTrash(trash);
                showToast('Kayıt kalıcı olarak silindi.', 'success');
                renderPage(currentRoute);
            });
        }

        // --- GELİŞMİŞ STOK EKRANI (Arama, Filtreleme, Yatay Kaydırma, Sayfalama) ---
        let stokPage = 1;
        let stokLimit = 25;
        let stokSortField = 'kod';
        let stokSortAsc = true;

        function renderGenelStokTablosu(db, main) {
            main.innerHTML = `
                <div class="space-y-4">
                    <!-- Arama ve Filtreleme Alanı -->
                    <div class="bg-dark-card border border-dark-border p-4 rounded-2xl flex flex-col md:flex-row gap-4 justify-between items-center">
                        <input type="text" id="stokSearch" oninput="filterStok()" placeholder="Ürün adı, kod veya barkod ile ara..." class="w-full md:w-80 bg-dark-bg border border-dark-border rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-brand-blue">
                        <div class="flex items-center gap-3 w-full md:w-auto justify-end">
                            <select id="stokKategoriFilter" onchange="filterStok()" class="bg-dark-bg border border-dark-border rounded-xl px-3 py-2 text-xs text-white">
                                <option value="">Tüm Kategoriler</option>
                                <option value="Mobilya">Mobilya</option>
                                <option value="Beyaz Eşya">Beyaz Eşya</option>
                                <option value="Züccaciye">Züccaciye</option>
                            </select>
                            <select id="stokDurumFilter" onchange="filterStok()" class="bg-dark-bg border border-dark-border rounded-xl px-3 py-2 text-xs text-white">
                                <option value="">Tüm Stok Durumu</option>
                                <option value="kritik">Kritik Stok</option>
                                <option value="normal">Normal Stok</option>
                            </select>
                            <select id="stokLimitSelect" onchange="changeStokLimit()" class="bg-dark-bg border border-dark-border rounded-xl px-3 py-2 text-xs text-white">
                                <option value="25">25 Kayıt</option>
                                <option value="50">50 Kayıt</option>
                                <option value="100">100 Kayıt</option>
                            </select>
                        </div>
                    </div>

                    <!-- Yatay Kaydırma Destekli Tablo -->
                    <div class="bg-dark-card border border-dark-border rounded-2xl overflow-x-auto">
                        <table class="w-full text-left border-collapse min-w-[700px]">
                            <thead>
                                <tr class="border-b border-dark-border text-gray-400 text-[11px] uppercase bg-dark-bg/50">
                                    <th class="p-4 cursor-pointer hover:text-white" onclick="sortStok('kod')">Ürün Kodu ↕</th>
                                    <th class="p-4 cursor-pointer hover:text-white" onclick="sortStok('ad')">Ürün Adı ↕</th>
                                    <th class="p-4">Kategori</th>
                                    <th class="p-4 cursor-pointer hover:text-white" onclick="sortStok('stok')">Stok Adedi ↕</th>
                                    <th class="p-4 cursor-pointer hover:text-white" onclick="sortStok('satisFiyati')">Satış Fiyatı ↕</th>
                                    <th class="p-4 text-right">İşlem</th>
                                </tr>
                            </thead>
                            <tbody id="stokTableBody" class="divide-y divide-dark-border text-xs"></tbody>
                        </table>
                    </div>
                    <div id="stokPagination" class="flex justify-between items-center text-xs text-gray-400 px-2"></div>
                </div>`;
            filterStok();
        }

        function filterStok() {
            const db = getDB();
            const search = document.getElementById('stokSearch')?.value.toLowerCase() || '';
            const kat = document.getElementById('stokKategoriFilter')?.value || '';
            const durum = document.getElementById('stokDurumFilter')?.value || '';

            let filtered = db.urunler.filter(u => {
                const matchSearch = u.ad.toLowerCase().includes(search) || u.kod.toLowerCase().includes(search);
                const matchKat = kat === '' || u.kategori === kat;
                const matchDurum = durum === '' ? true : (durum === 'kritik' ? u.stok <= u.kritikSinir : u.stok > u.kritikSinir);
                return matchSearch && matchKat && matchDurum;
            });

            // Sıralama
            filtered.sort((a, b) => {
                let valA = a[stokSortField];
                let valB = b[stokSortField];
                if (typeof valA === 'string') {
                    return stokSortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
                }
                return stokSortAsc ? valA - valB : valB - valA;
            });

            // Sayfalama
            const totalRecords = filtered.length;
            const totalPages = Math.ceil(totalRecords / stokLimit) || 1;
            if (stokPage > totalPages) stokPage = totalPages;
            const start = (stokPage - 1) * stokLimit;
            const paginated = filtered.slice(start, start + stokLimit);

            const tbody = document.getElementById('stokTableBody');
            if(!tbody) return;

            tbody.innerHTML = paginated.length === 0 ? `<tr><td colspan="6" class="p-6 text-center text-gray-400">Ürün bulunamadı.</td></tr>` :
                paginated.map(u => `
                    <tr class="hover:bg-dark-border/30 ${u.stok <= u.kritikSinir ? 'bg-brand-red/5' : ''}">
                        <td class="p-4 font-mono text-gray-400">${u.kod}</td>
                        <td class="p-4 font-semibold text-white flex items-center gap-2">
                            ${u.ad}
                            ${u.stok <= u.kritikSinir ? '<span class="px-2 py-0.5 bg-brand-red/10 text-brand-red text-[10px] rounded font-semibold animate-pulse">Kritik</span>' : ''}
                        </td>
                        <td class="p-4 text-gray-300">${u.kategori}</td>
                        <td class="p-4 font-bold ${u.stok <= u.kritikSinir ? 'text-brand-red' : 'text-brand-green'}">${u.stok} Adet</td>
                        <td class="p-4 font-bold text-white">${formatTL(u.satisFiyati)}</td>
                        <td class="p-4 text-right">
                            <button onclick="guvenliSil('urunler', '${u.id}', '${u.ad}')" class="text-brand-red hover:underline">Sil</button>
                        </td>
                    </tr>
                `).join('');

            document.getElementById('stokPagination').innerHTML = `
                <span>Toplam ${totalRecords} kayıttan ${(start+1)}-${Math.min(start+stokLimit, totalRecords)} arası gösteriliyor.</span>
                <div class="space-x-2">
                    <button onclick="changeStokPage(-1)" ${stokPage === 1 ? 'disabled class="opacity-50 cursor-not-allowed"' : ''} class="px-3 py-1 bg-dark-border rounded text-white">Önceki</button>
                    <span>Sayfa ${stokPage} / ${totalPages}</span>
                    <button onclick="changeStokPage(1)" ${stokPage === totalPages ? 'disabled class="opacity-50 cursor-not-allowed"' : ''} class="px-3 py-1 bg-dark-border rounded text-white">Sonraki</button>
                </div>
            `;
        }

        function sortStok(field) {
            if(stokSortField === field) stokSortAsc = !stokSortAsc;
            else { stokSortField = field; stokSortAsc = true; }
            filterStok();
        }

        function changeStokLimit() {
            stokLimit = parseInt(document.getElementById('stokLimitSelect').value);
            stokPage = 1;
            filterStok();
        }

        function changeStokPage(dir) {
            stokPage += dir;
            filterStok();
        }

        // --- CSV / EXCEL İÇE AKTARIM (Önizleme ve Mükerrer Engelleme) ---
        function renderCsvIceAktarim(main) {
            main.innerHTML = `
                <div class="max-w-xl bg-dark-card border border-dark-border p-6 rounded-2xl space-y-6">
                    <div>
                        <h3 class="font-bold text-sm text-white">CSV / Excel Veri Aktarımı</h3>
                        <p class="text-xs text-gray-400 mt-1">Ön muhasebe programınızdan aldığınız CSV veya Excel dosyalarını yükleyin. Sistem mükerrer kayıtları engeller ve önizleme sunar.</p>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Veri Türü Seçin</label>
                        <select id="importType" class="w-full bg-dark-bg border border-dark-border rounded-xl px-4 py-2.5 text-xs text-white">
                            <option value="urunler">Ürün / Stok Verileri</option>
                            <option value="musteriler">Müşteri / Cari Verileri</option>
                            <option value="subeler">Şube Verileri</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">CSV Dosyası Yükle</label>
                        <input type="file" id="csvFile" accept=".csv" class="w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-dark-border file:text-white">
                    </div>
                    <button onclick="csvOnizlemeAc()" class="w-full py-3 rounded-xl bg-brand-blue text-white text-xs font-semibold">Dosyayı Önizle ve Aktar</button>
                </div>
            `;
        }

        function csvOnizlemeAc() {
            const fileInput = document.getElementById('csvFile');
            const type = document.getElementById('importType').value;
            if(fileInput.files.length === 0) {
                showToast('Lütfen bir CSV dosyası seçin.', 'error');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.split('\n').filter(l => l.trim() !== '');
                if(lines.length < 2) {
                    showToast('Dosya boş veya geçersiz formatta.', 'error');
                    return;
                }

                const headers = lines[0].split(',').map(h => h.trim());
                const previewRows = lines.slice(1, 6).map(l => l.split(',').map(c => c.trim()));

                const m = document.getElementById('globalModal');
                const box = document.getElementById('modalBox');
                box.innerHTML = `
                    <div class="p-6 border-b border-dark-border flex justify-between items-center">
                        <h3 class="font-bold text-sm text-white">Aktarım Önizlemesi (${lines.length - 1} Satır)</h3>
                        <button onclick="modalKapat()" class="text-gray-400 hover:text-white">✕</button>
                    </div>
                    <div class="p-6 space-y-4">
                        <p class="text-xs text-gray-400">Sütunlar başarıyla algılandı. Mükerrer kayıtlar otomatik olarak filtrelenecektir.</p>
                        <div class="overflow-x-auto max-h-60 border border-dark-border rounded-xl">
                            <table class="w-full text-left text-xs">
                                <thead class="bg-dark-bg text-gray-400 border-b border-dark-border">
                                    <tr>${headers.map(h => `<th class="p-3">${h}</th>`).join('')}</tr>
                                </thead>
                                <tbody class="divide-y divide-dark-border">
                                    ${previewRows.map(row => `<tr>${row.map(cell => `<td class="p-3 text-white">${cell}</td>`).join('')}</tr>`).join('')}
                                </tbody>
                            </table>
                        </div>
                        <div class="flex justify-end gap-3 pt-4 border-t border-dark-border">
                            <button type="button" onclick="modalKapat()" class="px-4 py-2 rounded-xl bg-dark-border text-xs text-gray-300">İptal</option>
                            <button type="button" onclick="csvAktarimiOnayla('${type}', ${JSON.stringify(lines)})" class="px-4 py-2 rounded-xl bg-brand-green text-xs text-white font-semibold">Aktarımı Onayla</button>
                        </div>
                    </div>
                `;
                m.classList.remove('hidden');
            };
            reader.readAsText(fileInput.files[0]);
        }

        function csvAktarimiOnayla(type, lines) {
            const db = getDB();
            let eklenen = 0;
            let mukerrer = 0;

            for (let i = 1; i < lines.length; i++) {
                const cols = lines[i].split(',').map(c => c.trim());
                if(cols.length < 2) continue;

                if(type === 'urunler') {
                    const kod = cols[0];
                    const ad = cols[1];
                    const satisFiyati = parseFloat(cols[2]) || 1000;
                    const stok = parseInt(cols[3]) || 10;

                    if(db.urunler.some(u => u.kod === kod)) {
                        mukerrer++;
                    } else {
                        db.urunler.push({ id: 'ur_' + Date.now() + i, kod, ad, kategori: 'Genel', subeId: 'sube_1', alisFiyati: satisFiyati*0.7, satisFiyati, stok, kritikSinir: 3 });
                        eklenen++;
                    }
                }
            }

            saveDB(db);
            modalKapat();
            showToast(`Aktarım tamamlandı! ${eklenen} kayıt eklendi, ${mukerrer} mükerrer kayıt engellendi.`, 'success');
            renderPage(currentRoute);
        }

        // --- JSON YEDEKLEME VE DİĞER YARDIMCILAR ---
        function renderJsonYedekleme(main) {
            main.innerHTML = `
                <div class="max-w-xl bg-dark-card border border-dark-border p-6 rounded-2xl space-y-6">
                    <div>
                        <h3 class="font-bold text-sm text-white">Otomatik ve Manuel JSON Yedekleme</h3>
                        <p class="text-xs text-gray-400 mt-1">Sistem her işlemde güvenli depolama yapar. Dilerseniz tam yedeğinizi indirebilirsiniz.</p>
                    </div>
                    <button onclick="jsonIndir()" class="w-full py-3 rounded-xl bg-brand-blue text-white text-xs font-semibold">Tam JSON Yedeğini İndir</button>
                </div>
            `;
        }

        function jsonIndir() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(localStorage.getItem(STORAGE_KEY));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", "executive_control_yedek_" + new Date().toISOString().split('T')[0] + ".json");
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
            showToast('Yedek indirildi.', 'success');
        }

        function formatTL(tutar) {
            return new Intl.NumberFormat('tr-TR', { style: 'currency', currency: 'TRY', maximumFractionDigits: 0 }).format(tutar);
        }

        function modalKapat() {
            document.getElementById('globalModal').classList.add('hidden');
        }

        // Ekstra Sayfa Bağlantıları
        function renderFinansTablosu(db, main, tip, baslik) {
            main.innerHTML = `<div class="bg-dark-card border border-dark-border p-6 rounded-2xl"><h3 class="text-sm font-bold text-white mb-4">${baslik}</h3><p class="text-xs text-gray-400">Veriler güvenli depoda saklanmaktadır.</p></div>`;
        }
        function renderKarlilikAnalizi(db, main) { renderGenelBakis(db, main); }
        function renderNakitAkis(db, main) { renderGenelBakis(db, main); }
        function renderKritikStok(db, main) { renderGenelStokTablosu(db, main); }

        window.addEventListener('DOMContentLoaded', () => {
            getDB();
            initNavigation();
            navigateTo('genel-bakis');
        });
    </script>
</body>
