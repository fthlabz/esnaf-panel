        function initNavigation() {
            const desktopNav = document.getElementById('desktopNavContent');
            const mobileNav = document.getElementById('mobileNavContent');
            
            let html = '';
            menuStructure.forEach(group => {
                html += `<div class="space-y-1">
                    <p class="text-[11px] font-bold text-gray-400 uppercase tracking-wider px-2">${group.baslik}</p>
                    <div class="space-y-0.5 mt-1">`;
                group.items.forEach(item => {
                    html += `<button onclick="navigateTo('${item.id}')" id="nav_${item.id}" class="w-full text-left px-3 py-2 rounded-lg text-xs font-medium text-gray-300 hover:bg-dark-border hover:text-white transition-all flex items-center justify-between">
                        <span>${item.ad}</span>
                    </button>`;
                });
                html += `</div></div>`;
            });

            desktopNav.innerHTML = html;
            mobileNav.innerHTML = html;
            document.getElementById('headerDate').innerText = new Date().toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        function navigateTo(routeId) {
            currentRoute = routeId;
            document.querySelectorAll('aside button, #mobileNavContent button').forEach(b => b.classList.remove('bg-brand-blue', 'text-white', 'shadow-md'));
            const activeBtnD = document.getElementById(`desktopNavContent`)?.querySelector(`#nav_${routeId}`);
            if(activeBtnD) activeBtnD.classList.add('bg-brand-blue', 'text-white', 'shadow-md');
            
            const activeBtnM = document.getElementById(`mobileNavContent`)?.querySelector(`#nav_${routeId}`);
            if(activeBtnM) activeBtnM.classList.add('bg-brand-blue', 'text-white');

            // Mobil menüyü kapat
            document.getElementById('mobileMenu').classList.add('hidden');

            renderPage(routeId);
        }

        function toggleMobileMenu() {
            const m = document.getElementById('mobileMenu');
            m.classList.toggle('hidden');
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const bg = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-red-600' : 'bg-blue-600';
            toast.className = `${bg} text-white px-4 py-3 rounded-xl text-xs font-medium shadow-xl pointer-events-auto transition-all transform translate-y-2 opacity-0 flex items-center justify-between gap-3`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

                case 'sube-yonetimi': renderSubeYonetimi(db, main); break;
                case 'sirket-performansi': renderSirketPerformansi(db, main); break;
                case 'yonetici-merkezi': renderYoneticiMerkezi(db, main); break;
                case 'kritik-uyarilar': renderKritikUyarilar(db, main); break;

            return new Intl.NumberFormat('tr-TR', { style: 'currency', currency: 'TRY', maximumFractionDigits: 0 }).format(tutar);
        }

                        <div class="h-80 relative flex items-center justify-center">

                                <div class="p-3 bg-dark-border/50 rounded-xl border border-dark-border flex items-center justify-between">

        function urunKaydet(e) {
            e.preventDefault();
            const db = getDB();
            db.urunler.push({
                id: 'ur_' + Date.now(),
                kod: document.getElementById('uKod').value,
                ad: document.getElementById('uAd').value,
                kategori: 'Genel',
                subeId: 'sube_1',
                alisFiyati: 500,
                satisFiyati: parseFloat(document.getElementById('uFiyat').value),
                stok: parseInt(document.getElementById('uStok').value),
                kritikSinir: 3
            });
            saveDB(db);
            modalKapat();
            showToast('Ürün eklendi.', 'success');
            renderPage(currentRoute);
        }

        function urunSil(id) {
            const db = getDB();
            db.urunler = db.urunler.filter(u => u.id !== id);
            saveDB(db);
            showToast('Ürün silindi.', 'success');
            renderPage(currentRoute);
        }

        function renderJsonYedekleme(db, main) {

                    <button onclick="jsonIndir()" class="w-full py-3 rounded-xl bg-brand-blue text-white text-xs font-semibold shadow-lg shadow-blue-500/20">Verileri JSON Olarak İndir</button>
                    
                    <div class="pt-6 border-t border-dark-border space-y-4">
                        <h3 class="font-bold text-sm text-white">Yedekten Geri Yükle</h3>
                        <input type="file" id="jsonFile" accept=".json" class="w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-dark-border file:text-white hover:file:bg-gray-700">
                        <button onclick="jsonYukle()" class="w-full py-3 rounded-xl bg-brand-green text-white text-xs font-semibold">Yedekten Yükle</button>
                    </div>
                </div>
            `;
        }

        function jsonIndir() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(localStorage.getItem(STORAGE_KEY));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", "executive_control_yedek_" + new Date().toISOString().split('T')[0] + ".json");
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
            showToast('Yedek başarıyla indirildi.', 'success');
        }

        function jsonYukle() {
            const fileInput = document.getElementById('jsonFile');
            if(fileInput.files.length === 0) {
                showToast('Lütfen bir JSON dosyası seçin.', 'error');
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
                    showToast('Veriler başarıyla geri yüklendi.', 'success');
                    loadPage(currentRoute);
                } catch(err) {
                    showToast('Geçersiz dosya formatı.', 'error');
                }
            };
            reader.readAsText(fileInput.files[0]);
        }

        function csvIndir() {
            const db = getDB();
            let csv = "Sube Adi,Il,Ciro,Kar,Gider\n";
            db.subeler.forEach(s => {
                csv += `"${s.ad}","${s.il}",${s.ciro},${s.kar},${s.gider}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'subeler_raporu.csv';
            a.click();
            showToast('CSV dosyası oluşturuldu.', 'success');
